# Perfil usado na hospedagem (Render): SPRING_PROFILES_ACTIVE=render
# Banco em memoria carregado com uma copia dos estandes, alvos e armas (deploy/dados-iniciais.sql).
# O que os colegas criarem dura ate o servico reiniciar; ai volta ao conteudo inicial.
spring.datasource.url=jdbc:h2:mem:estandes;DB_CLOSE_DELAY=-1
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:deploy/dados-iniciais.sql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=false
spring.h2.console.enabled=false
