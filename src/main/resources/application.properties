spring.application.name=estande-tiro-ia
server.port=${PORT:8080}

# Carrega o arquivo .env da raiz do projeto (formato CHAVE=valor) como propriedades.
# Variaveis de ambiente do sistema, se existirem, tem prioridade sobre o .env.
spring.config.import=optional:file:.env[.properties]

# ---------------- Banco H2 em arquivo (./data/estandes.mv.db) ----------------
spring.datasource.url=jdbc:h2:file:./data/estandes;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false
# sessao so por cookie (evita o ";jsessionid=" na URL depois dos redirecionamentos)
server.servlet.session.tracking-modes=cookie

# ---------------- Spring AI ----------------
# A autoconfiguracao do Google GenAI usa uma chave so. Aqui sao duas, entao ela fica desligada
# e os beans (ChatClient e ImageService) sao criados a mao em config/GenAiConfig.java.
spring.ai.model.chat=none
spring.ai.model.embedding.text=none

# ---------------- Chaves: SO referencias as variaveis (os valores ficam no .env) ----------------
gemini.key.text=${GEMINI_API_KEY_TEXT}
gemini.key.image=${GEMINI_API_KEY_IMAGE}

# ---------------- Modelos (troque aqui) ----------------
# Texto (chave gratuita, via Spring AI ChatClient): modelo flash-lite do free tier
gemini.text.model=gemini-3.5-flash-lite
gemini.text.timeout-segundos=60

# Imagem (chave faturada, via RestClient): Nano Banana 2 Lite, o mais barato da familia Nano Banana
gemini.image.model=gemini-3.1-flash-lite-image
gemini.image.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.image.aspect-ratio=16:9
gemini.image.timeout-segundos=120
# Preco de referencia por imagem 1K (pagina de precos do Gemini, nov/2026). Usado so para estimar o gasto.
gemini.image.preco-usd=0.0336

# ---------------- Controle de custo ----------------
# Maximo de imagens por execucao (MAX_IMAGE_GENERATIONS no .env; vazio = 5)
app.imagem.max-geracoes=${MAX_IMAGE_GENERATIONS:5}
# Onde as imagens sao salvas (servidas em /assets/cenarios/<id>.png)
app.cenarios.pasta=./assets/cenarios
# Imagens dos alvos (inimigos) geradas pela IA: recorte pronto (publico) e a original (fora do Git)
app.alvos.pasta=./assets/alvos
app.alvos.originais=./data/alvos-originais
